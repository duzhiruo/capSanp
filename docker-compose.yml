services:
  mysql:
    image: mysql:8.4
    container_name: capsnap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: capsnap
    ports:
      - "3306:3306"
    volumes:
      - capsnap-mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

  qdrant:
    image: qdrant/qdrant:latest
    container_name: capsnap-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - capsnap-qdrant:/qdrant/storage

volumes:
  capsnap-mysql:
  capsnap-qdrant:
