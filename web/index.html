<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CapSnap Agent 原型</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 32px auto;
        max-width: 960px;
        line-height: 1.6;
        color: #172033;
      }
      section {
        border: 1px solid #dde3ee;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 20px;
      }
      input,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
        padding: 10px;
      }
      button {
        cursor: pointer;
        background: #635bff;
        color: white;
        border: 0;
        border-radius: 8px;
      }
      pre {
        background: #101828;
        color: #e6edf7;
        padding: 16px;
        border-radius: 12px;
        overflow: auto;
      }
      .hint {
        color: #667085;
      }
    </style>
  </head>
  <body>
    <h1>CapSnap Agent 原型</h1>
    <p class="hint">这个页面用于验证后端 Agent 核心链路：上传截图 → 创建 Agent Run → OCR Tool → LLM Tool → Memory → 查询轨迹。</p>

    <section>
      <h2>1. 上传截图并运行 Agent</h2>
      <input id="deviceId" value="demo-device" />
      <input id="file" type="file" accept="image/*" />
      <textarea id="ocrText" rows="5" placeholder="原型阶段可以手动填 OCR 文本，后续会替换成真实 OCR。"></textarea>
      <button onclick="upload()">上传并整理</button>
    </section>

    <section>
      <h2>2. 搜索截图</h2>
      <input id="query" placeholder="输入关键词，比如 竞品、价格、会议" />
      <button onclick="search()">搜索</button>
    </section>

    <section>
      <h2>3. 查看 Agent Run</h2>
      <input id="runId" placeholder="上传后会自动填入 run_id" />
      <button onclick="loadRun()">查看运行轨迹</button>
    </section>

    <section>
      <h2>结果</h2>
      <pre id="output">等待操作...</pre>
    </section>

    <script>
      const output = document.querySelector("#output");

      function show(value) {
        output.textContent = JSON.stringify(value, null, 2);
      }

      async function upload() {
        const file = document.querySelector("#file").files[0];
        if (!file) {
          show({ error: "请先选择一张截图" });
          return;
        }
        const form = new FormData();
        form.append("device_id", document.querySelector("#deviceId").value || "demo-device");
        form.append("file", file);
        form.append("ocr_text", document.querySelector("#ocrText").value);
        const resp = await fetch("/v1/screenshots", { method: "POST", body: form });
        const data = await resp.json();
        if (data.run_id) {
          document.querySelector("#runId").value = data.run_id;
        }
        show(data);
      }

      async function search() {
        const deviceId = document.querySelector("#deviceId").value || "demo-device";
        const query = document.querySelector("#query").value;
        const resp = await fetch(`/v1/search?device_id=${encodeURIComponent(deviceId)}&q=${encodeURIComponent(query)}`);
        show(await resp.json());
      }

      async function loadRun() {
        const runId = document.querySelector("#runId").value;
        if (!runId) {
          show({ error: "请先填写 run_id" });
          return;
        }
        const resp = await fetch(`/v1/agent-runs/${encodeURIComponent(runId)}`);
        show(await resp.json());
      }
    </script>
  </body>
</html>
